<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<title>교내 연구진흥사업 만족도 설문조사</title>
<style>
/* Layout: 한 화면 한 단계. 진행바 아래 카드 하나가 현재 단계(도입 공통 → 사업별 13개 → 마무리 공통)를 보여준다. */
:root {
  --bg: #f4f7f8;
  --surface: #ffffff;
  --ink: #14232b;
  --muted: #566a74;
  --line: #d5dfe3;
  --accent: #0b6b8a;
  --accent-ink: #ffffff;
  --accent-soft: #e4f1f5;
  --warn: #b3261e;
  --warn-soft: #fbeae8;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a20; --surface: #15252d; --ink: #e5eef1; --muted: #93a7b0; --line: #2a3e48;
    --accent: #4fb9d9; --accent-ink: #06222c; --accent-soft: #163541;
    --warn: #f0877f; --warn-soft: #3a2422;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a20; --surface: #15252d; --ink: #e5eef1; --muted: #93a7b0; --line: #2a3e48;
  --accent: #4fb9d9; --accent-ink: #06222c; --accent-soft: #163541;
  --warn: #f0877f; --warn-soft: #3a2422;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.6; }
.wrap {
  max-width: 760px; margin: 0 auto; padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.brand { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.link { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
.prog { margin-bottom: 18px; }
.prog-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.prog-bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.prog-bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; }
h1 { font-size: 26px; line-height: 1.3; margin: 0 0 12px; text-wrap: balance; }
h2 { font-size: 21px; line-height: 1.35; margin: 0 0 6px; text-wrap: balance; }
h3.sub { font-size: 15px; margin: 8px 0 14px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--accent); }
p { margin: 0 0 12px; }
.lead { color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin-bottom: 6px; }
.banner { border: 1px solid var(--line); background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
.notice { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; }
.notice p { margin: 0 0 4px; }
.notice p:last-child { margin: 0; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 14px 0; font-size: 14px; }
.facts dt { color: var(--muted); font-weight: 600; }
.facts dd { margin: 0; min-width: 0; }
.info { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0 22px; font-size: 14px; }
.info-h { font-weight: 700; margin-bottom: 8px; }
.sec { margin-bottom: 12px; }
.sec-h { font-weight: 600; margin-bottom: 2px; }
.ln { padding-left: .9em; text-indent: -.9em; overflow-wrap: anywhere; margin: 0 0 2px; }
.ln.sub { margin-left: 1.2em; }
.ln.warn { color: var(--warn); font-weight: 600; }
.more { margin: 8px 0 0; }
.more a, .avg a { color: var(--accent); font-weight: 600; }
.tbl { overflow-x: auto; margin: 8px 0; }
.tbl table { border-collapse: collapse; font-size: 13px; min-width: 280px; background: var(--surface); }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 5px 10px; text-align: center; vertical-align: middle; }
.tbl th { background: var(--bg); }
.tbl td.l { text-align: left; }
.tbl .warn { color: var(--warn); font-weight: 600; }
fieldset { border: 0; padding: 0; margin: 0 0 24px; min-width: 0; }
legend { padding: 0; font-weight: 600; margin-bottom: 10px; }
.qn { display: inline-block; min-width: 2.2em; color: var(--accent); font-variant-numeric: tabular-nums; }
legend em { font-style: normal; font-weight: 400; color: var(--muted); font-size: 14px; }
.qhint { font-size: 13px; color: var(--muted); margin: -4px 0 10px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; cursor: pointer; background: var(--surface); }
.opt:hover { border-color: var(--accent); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt.dis { opacity: .45; cursor: not-allowed; }
.opt input { margin-top: 5px; accent-color: var(--accent); flex: none; }
.opt span { min-width: 0; overflow-wrap: anywhere; }
.other, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.other { margin-top: 2px; }
textarea { min-height: 110px; resize: vertical; }
input:focus-visible, textarea:focus-visible, button:focus-visible, .opt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
.hint { font-size: 13px; color: var(--muted); flex: 1 1 100%; order: -1; min-height: 1.4em; }
.btn { font: inherit; font-weight: 600; border-radius: 10px; padding: 11px 22px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
a.btn { text-decoration: none; display: inline-block; }
.steps-help { margin: 14px 0 0; padding-left: 1.3em; font-size: 14px; color: var(--muted); }
.steps-help li { margin-bottom: 4px; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.toc { overflow-x: auto; margin: 14px 0 6px; }
.toc table { border-collapse: collapse; font-size: 14px; width: 100%; min-width: 300px; }
.toc th, .toc td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
.toc th { background: var(--bg); }
.toc td:first-child { white-space: nowrap; width: 5em; color: var(--muted); }
.signoff { color: var(--muted); margin-top: 14px; }
/* results */
.res h3 { font-size: 16px; margin: 26px 0 8px; }
.res .q-title { font-weight: 600; margin: 14px 0 6px; font-size: 15px; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0 4px; }
.stat { flex: 1 1 120px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.bar { display: grid; grid-template-columns: minmax(0, 40%) 1fr 3.2em; gap: 10px; align-items: center; font-size: 14px; margin: 4px 0; font-variant-numeric: tabular-nums; }
.bar .lbl { min-width: 0; overflow-wrap: anywhere; }
.bar .track { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar .track i { display: block; height: 100%; background: var(--accent); }
.bar .n { text-align: right; color: var(--muted); }
.texts { margin: 6px 0 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
.texts li { overflow-wrap: anywhere; }
.avg { font-size: 14px; color: var(--muted); margin: 0 0 4px; }
@media (max-width: 440px) {
  .card { padding: 18px 14px; }
  h1 { font-size: 23px; }
  .bar { grid-template-columns: minmax(0, 46%) 1fr 2.6em; }
}
@media (prefers-reduced-motion: reduce) { .prog-bar i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">교내 연구진흥사업 만족도 설문조사</div>
  </div>
  <div id="app"></div>
</div>
<script>
/* ---------- 설문 내용은 구글 시트에서 읽어 옵니다 (코드를 고칠 필요 없음) ---------- */
const Q = (id, no, text, type, opts, o) => Object.assign({ id, no, text, type, opts: opts || [] }, o || {});
let META = {}, COMMON = [], BIZ = [], CLOSING = [], SEL = null;
const QMAP = {};
function applyConfig(cfg) {
  META = cfg.meta || {};
  COMMON = cfg.common || [];
  CLOSING = cfg.closing || [];
  BIZ = (cfg.businesses || []).map((b) => Object.assign({}, b, { label: b.no + '. ' + b.name, use: b.questions || [] }));
  const none = META.noneLabel || '';
  SEL = Q('sel', '1', META.selectQ || '', 'multi', BIZ.map((b) => b.label).concat(none ? [none] : []), { none: none || undefined, hint: META.selectHint || '' });
  Object.keys(QMAP).forEach((k) => delete QMAP[k]);
  [...COMMON, SEL, ...CLOSING, ...BIZ.flatMap((b) => b.use)].forEach((q) => { QMAP[q.id] = q; });
  const brand = document.querySelector('.brand');
  if (brand) brand.textContent = META.title || '';
  if (META.title) document.title = META.title;
}
/* ---------- 설정 읽기 끝 ---------- */

const $app = document.getElementById('app');
const S = { answers: {}, step: 0, completed: false, ready: false, db: null, dl: null, mcp: null, driveMsg: '', driveUrl: '', driving: false,
            uid: null, canSave: false, canEdit: false, view: 'survey', saveErr: false, returning: false, rows: null, authMsg: '' };

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const bizById = (id) => BIZ.find((b) => b.id === id);
const selectedBiz = () => { const sel = S.answers.sel; return Array.isArray(sel) ? BIZ.filter((b) => sel.includes(b.label)) : []; };
const steps = () => [{ t: 'intro' }, { t: 'common' }, { t: 'select' }, ...selectedBiz().map((b) => ({ t: 'biz', id: b.id })), { t: 'closing' }, { t: 'done' }];

function visibleQs(step) {
  if (step.t === 'common') return COMMON;
  if (step.t === 'closing') return CLOSING;
  if (step.t === 'select') return [SEL];
  if (step.t === 'biz') return bizById(step.id).use;
  return [];
}
function answered(q) {
  if (q.opt) return true;
  const v = S.answers[q.id];
  if (q.type === 'multi') return Array.isArray(v) && (q.exact ? v.length === q.exact : v.length > 0);
  if (q.type === 'text') return typeof v === 'string' && v.trim() !== '';
  return v !== undefined && v !== '';
}
const stepOk = (step) => visibleQs(step).every(answered);

/* ---------- 저장 ---------- */
let chain = Promise.resolve();
function pruned() {
  const keep = new Set();
  steps().forEach((st) => visibleQs(st).forEach((q) => { keep.add(q.id); keep.add(q.id + '_etc'); }));
  const out = {};
  Object.keys(S.answers).forEach((k) => { if (keep.has(k)) out[k] = S.answers[k]; });
  return out;
}
function save(done) {
  if (!S.canSave) return Promise.resolve(false);
  const answers = pruned();
  const payload = { answers, completed: done ? true : S.completed };
  chain = chain.then(() => gs('saveResponse', payload)).then((r) => { S.saveErr = !(r && r.ok); return !S.saveErr; }, () => { S.saveErr = true; return false; });
  return chain;
}

/* ---------- 화면 조각 ---------- */
function qHTML(q) {
  const v = S.answers[q.id];
  const arr = Array.isArray(v) ? v : [];
  const limit = q.exact || q.max || 0;
  let body = '';
  if (q.type === 'single') {
    body = q.opts.map((o) => `<label class="opt${v === o ? ' on' : ''}"><input type="radio" name="${q.id}" value="${esc(o)}"${v === o ? ' checked' : ''}><span>${esc(o)}</span></label>`).join('');
  } else if (q.type === 'multi') {
    body = q.opts.map((o) => {
      const on = arr.includes(o);
      const dis = limit && !on && arr.length >= limit;
      return `<label class="opt${on ? ' on' : ''}${dis ? ' dis' : ''}"><input type="checkbox" name="${q.id}" value="${esc(o)}"${on ? ' checked' : ''}${dis ? ' disabled' : ''}><span>${esc(o)}</span></label>`;
    }).join('');
  } else {
    body = `<textarea name="${q.id}" aria-label="${esc(q.text)}" placeholder="(답변: 주관식으로 기입/장문형)">${esc(v || '')}</textarea>`;
  }
  if (q.other) {
    const show = q.type === 'multi' ? arr.includes(q.other) : v === q.other;
    body += `<input class="other" type="text" data-etc="${q.id}" aria-label="직접 입력" placeholder="직접 입력"${show ? '' : ' hidden'} value="${esc(S.answers[q.id + '_etc'] || '')}">`;
  }
  const cnt = q.exact ? ` <em class="cnt">(${arr.length} / ${q.exact} 선택)</em>` : '';
  return `<fieldset data-q="${q.id}"><legend><span class="qn">Q${esc(q.no)}</span>${esc(q.text)}${q.opt && q.type !== 'text' ? ' <em>(선택)</em>' : ''}${cnt}</legend>${q.hint ? `<div class="qhint">${esc(q.hint)}</div>` : ''}${body}</fieldset>`;
}
function tableHTML(tb) {
  const cell = (c, tag) => { const w = c[0] === '!'; return `<${tag}${w ? ' class="warn"' : ''}>${esc(w ? c.slice(1) : c)}</${tag}>`; };
  const head = tb.head && tb.head.some((x) => x) ? `<thead><tr>${tb.head.map((c) => cell(c, 'th')).join('')}</tr></thead>` : '';
  return `<div class="tbl"><table>${head}<tbody>${tb.rows.map((r) => `<tr>${r.map((c) => cell(c, 'td')).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function infoHTML(b) {
  const link = b.link ? `<p class="more">※ 자세한 사항은 <a href="${esc(b.link)}" target="_blank" rel="noopener">홈페이지 참조</a></p>` : '';
  const item = (it) => it.type === 'table' ? tableHTML(it) : `<div class="ln${it.cls && it.cls !== 'ln' ? ' ' + it.cls : ''}">${esc(it.t)}</div>`;
  if (!b.sections.length && !link) return '';
  return `<div class="info"><div class="info-h">&lt;사업 주요 내용 안내&gt;</div>` +
    b.sections.map((s) => `<div class="sec">${s.h ? `<div class="sec-h">${esc(s.h)}</div>` : ''}${s.items.map(item).join('')}</div>`).join('') + link + '</div>';
}
function progressHTML(idx, list) {
  const total = list.length - 2;
  const st = list[idx];
  const label = st.t === 'common' ? '공통 질문' : st.t === 'select' ? '사업 선택' : st.t === 'closing' ? '마무리 공통 질문' : '선택한 사업 질문 ' + (selectedBiz().findIndex((x) => x.id === st.id) + 1) + ' / ' + selectedBiz().length;
  return `<div class="prog"><div class="prog-meta"><span>${esc(label)}</span><span>${idx} / ${total}</span></div><div class="prog-bar"><i style="width:${(idx / total) * 100}%"></i></div></div>`;
}
function bannerHTML() {
  if (!S.ready || S.canSave) return S.saveErr ? '<div class="banner">응답을 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.</div>' : '';
  return '<div class="banner">' + esc(S.authMsg || '학교 Google 계정으로 로그인한 상태에서만 응답할 수 있습니다. 로그인 계정을 확인한 뒤 페이지를 새로고침해 주세요.') + ' 한 계정당 응답은 한 건만 저장됩니다.</div>';
}
function navHTML(idx, label) {
  return `<div class="nav"><div class="hint" id="hint"></div>
    <button class="btn ghost" type="button" data-go="-1"${idx <= 1 ? ' hidden' : ''}>이전</button>
    <button class="btn" type="button" id="next" data-go="1">${label}</button></div>`;
}
const para = (t) => esc(t).replace(/\n/g, '<br>');

function render() {
  const list = steps();
  const step = list[S.step];
  let html = '';
  if (step.t === 'intro') {
    html = `${bannerHTML()}<div class="card"><div class="eyebrow">설문 안내</div>
      <h1>${esc(META.title || '')}</h1>
      ${(META.intro || []).map((t) => `<p>${para(t)}</p>`).join('')}
      ${META.period || META.target ? `<dl class="facts">${META.period ? `<dt>조사기간</dt><dd>${esc(META.period)}</dd>` : ''}${META.target ? `<dt>조사대상</dt><dd>${esc(META.target)}</dd>` : ''}</dl>` : ''}
      ${!S.ready ? '<div class="nav"><span class="lead">로그인 상태를 확인하는 중…</span><button class="btn" type="button" disabled>시작하기</button></div>' : S.canSave ? `<div class="nav"><span></span><button class="btn" type="button" data-go="1">${Object.keys(S.answers).length ? '이어서 시작' : '시작하기'}</button></div>` : ''}</div>`;
  } else if (step.t === 'common') {
    html = progressHTML(S.step, list) + `<div class="card"><h2>${esc(META.commonTitle)}</h2>${META.commonLead ? `<p class="lead">${esc(META.commonLead)}</p>` : ''}${COMMON.map(qHTML).join('')}${navHTML(S.step, '다음')}</div>`;
  } else if (step.t === 'select') {
    html = progressHTML(S.step, list) + `<div class="card"><h2>${esc(META.selectTitle)}</h2>${META.selectLead ? `<p class="lead">${esc(META.selectLead)}</p>` : ''}${qHTML(SEL)}${navHTML(S.step, '다음')}</div>`;
  } else if (step.t === 'biz') {
    const b = bizById(step.id);
    const sel = selectedBiz();
    const k = sel.findIndex((x) => x.id === b.id) + 1;
    html = progressHTML(S.step, list) +
      (k === 1 && (META.bizNotice || []).length ? `<div class="notice">${META.bizNotice.map((t) => `<p>${esc(t)}</p>`).join('')}</div>` : '') +
      `<div class="card"><div class="eyebrow">사업 ${esc(b.no)} · 선택한 사업 ${k} / ${sel.length}</div><h2>${esc(b.name)}</h2>${infoHTML(b)}${b.use.map(qHTML).join('')}${navHTML(S.step, k === sel.length ? '마무리 질문으로' : '다음 사업')}</div>`;
  } else if (step.t === 'closing') {
    html = progressHTML(S.step, list) + `${META.closingNotice ? `<div class="notice"><p>${esc(META.closingNotice)}</p></div>` : ''}<div class="card"><h2>${esc(META.closingTitle)}</h2>${CLOSING.map(qHTML).join('')}${navHTML(S.step, '제출하기')}</div>`;
  } else {
    html = `${bannerHTML()}<div class="card"><div class="eyebrow">제출 완료</div><h1>응답해 주셔서 감사합니다</h1>
      <p class="lead">${!S.canSave ? '응답이 저장되지 않았습니다. 로그인 상태와 권한을 확인한 뒤 다시 제출해 주세요.' : S.returning ? '이미 제출하신 응답이 있습니다. 한 계정당 응답은 한 건만 저장되며, 수정 후 다시 제출하면 기존 응답이 새 내용으로 바뀝니다.' : '응답이 저장되었습니다.'}</p>
      ${META.signoff ? `<p>${para(META.signoff)}</p>` : ''}${META.signer ? `<p class="signoff">${esc(META.signer)}</p>` : ''}
      <div class="nav"><span></span><button class="btn ghost" type="button" data-go="edit">응답 수정하기</button></div></div>`;
  }
  $app.innerHTML = (step.t === 'intro' || step.t === 'done') ? html : bannerHTML() + html;
  updateNext();
}

function updateNext() {
  const next = document.getElementById('next');
  if (!next) return;
  const ok = stepOk(steps()[S.step]);
  next.disabled = !ok;
  const hint = document.getElementById('hint');
  if (hint) hint.textContent = ok ? '' : '필수 문항(선택 표시가 없는 문항)에 모두 응답하면 다음으로 넘어갈 수 있습니다.';
}

/* ---------- 입력 처리 ---------- */
$app.addEventListener('change', (e) => {
  const el = e.target;
  if (!(el instanceof HTMLInputElement) || (el.type !== 'radio' && el.type !== 'checkbox')) return;
  const q = QMAP[el.name];
  if (!q) return;
  const fs = el.closest('fieldset');
  if (q.type === 'multi') {
    const set = new Set(Array.isArray(S.answers[q.id]) ? S.answers[q.id] : []);
    if (el.checked) set.add(el.value); else set.delete(el.value);
    if (q.none) { if (el.value === q.none && el.checked) { set.clear(); set.add(q.none); } else if (el.checked) set.delete(q.none); }
    const arr = q.opts.filter((o) => set.has(o));
    S.answers[q.id] = arr;
    const limit = q.exact || q.max || 0;
    fs.querySelectorAll('input[type=checkbox]').forEach((i) => {
      i.checked = arr.includes(i.value);
      if (limit) i.disabled = !i.checked && arr.length >= limit;
      const lab = i.closest('.opt');
      lab.classList.toggle('on', i.checked);
      lab.classList.toggle('dis', i.disabled);
    });
    const cnt = fs.querySelector('.cnt');
    if (cnt && q.exact) cnt.textContent = '(' + arr.length + ' / ' + q.exact + ' 선택)';
  } else {
    S.answers[q.id] = el.value;
    fs.querySelectorAll('.opt').forEach((l) => l.classList.toggle('on', l.contains(el) && el.checked));
  }
  if (q.other) {
    const cur = S.answers[q.id];
    const show = q.type === 'multi' ? (cur || []).includes(q.other) : cur === q.other;
    const o = fs.querySelector('.other');
    if (o) o.hidden = !show;
  }
  updateNext();
});
$app.addEventListener('input', (e) => {
  const t = e.target;
  if (t instanceof HTMLTextAreaElement) S.answers[t.name] = t.value;
  else if (t instanceof HTMLInputElement && t.dataset.etc) S.answers[t.dataset.etc + '_etc'] = t.value;
  if (t instanceof HTMLTextAreaElement) updateNext();
});
$app.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-go]');
  if (!btn || btn.disabled) return;
  const go = btn.dataset.go;
  const list = steps();
  const cur = list[S.step];
  if (go === 'edit') { S.step = 1; render(); window.scrollTo(0, 0); return; }
  const dir = Number(go);
  if (dir === 1 && cur.t === 'closing') {
    btn.disabled = true;
    await save(true);
    S.completed = true;
    S.returning = false;
    S.step = list.length - 1;
  } else {
    if (dir === 1 && cur.t !== 'intro') save(false);
    S.step = Math.max(0, Math.min(list.length - 1, S.step + dir));
  }
  render();
  window.scrollTo(0, 0);
});

/* google.script.run 을 Promise 로 감싼다 */
const gs = (fn, ...args) => new Promise((ok, fail) => google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](...args));

/* ---------- 로그인 안내 : 학교 계정이 아닐 때 계정을 바꿀 수 있게 한다 ---------- */
function renderLogin(info) {
  const domain = info.domain || 'yonsei.ac.kr';
  const url = info.url && info.url.indexOf('https://') === 0 ? info.url : '';
  const chooser = url ? 'https://accounts.google.com/AccountChooser?hd=' + encodeURIComponent(domain) + '&continue=' + encodeURIComponent(url) : '';
  $app.innerHTML = `<div class="card"><div class="eyebrow">로그인 필요</div>
    <h1>학교 구글 계정으로 로그인해 주세요</h1>
    <p class="lead">이 설문은 <b>@${esc(domain)}</b> 계정으로만 응답할 수 있습니다. 한 계정당 응답은 한 건만 저장됩니다.</p>
    ${info.msg ? `<div class="banner">${esc(info.msg)}</div>` : ''}
    ${info.email ? `<p>현재 로그인한 계정: <b>${esc(info.email)}</b></p>` : ''}
    <div class="nav" style="justify-content:flex-start;gap:10px">
      ${chooser ? `<a class="btn" href="${esc(chooser)}" target="_top" rel="noopener">다른 구글 계정으로 로그인</a>` : ''}
      <button class="btn ghost" type="button" id="relogin">로그인 후 새로고침</button>
    </div>
    <ol class="steps-help">
      <li>위 버튼을 눌러 구글 계정 선택 화면에서 <b>학교 계정(@${esc(domain)})</b>을 고르거나 "다른 계정 사용"으로 로그인합니다.</li>
      <li>버튼이 동작하지 않으면 구글 화면 오른쪽 위 프로필 → <b>다른 계정 추가</b>로 학교 계정을 로그인한 뒤, 이 링크를 다시 열어 주세요.</li>
      <li>개인 계정과 학교 계정이 섞여 계속 막히면 <b>시크릿(비공개) 창</b>에서 링크를 열어 학교 계정으로만 로그인해 보세요.</li>
    </ol></div>`;
  const b = document.getElementById('relogin');
  if (b) b.addEventListener('click', () => { try { window.top.location.reload(); } catch (e) { location.reload(); } });
}

/* ---------- 시작 ---------- */
$app.innerHTML = '<div class="card"><p class="lead">설문을 불러오는 중…</p></div>';
gs('boot').then((res) => {
  const st = res.state;
  if (!st || !st.ok) { S.canSave = false; S.needLogin = { msg: (st && st.message) || '', email: (st && st.email) || '', domain: (st && st.domain) || '', url: res.webUrl || '' }; return; }
  applyConfig(res.config);
  S.canSave = true;
  const d = st.data;
  if (d && d.answers && typeof d.answers === 'object') {
    /* 저장된 응답이 늦게 도착해도, 이미 진행 중인 응답을 덮어쓰지 않는다 */
    S.answers = Object.assign({}, d.answers);
    S.completed = !!d.completed;
    if (S.completed) { S.returning = true; S.step = steps().length - 1; }
  }
}).catch(() => { S.canSave = false; S.loadFailed = true; }).then(() => {
  S.ready = true;
  if (S.needLogin) { renderLogin(S.needLogin); return; }
  if (S.loadFailed) { $app.innerHTML = '<div class="card"><div class="banner">설문을 불러오지 못했습니다. 페이지를 새로고침해 주세요. 계속되면 담당자에게 알려 주세요.</div></div>'; return; }
  render();
});
</script>
